<!DOCTYPE html>
<html lang="nl">
<head><meta charset="UTF-8"><title>Foto's downloaden</title>
<style>
  body{font-family:system-ui;max-width:500px;margin:3rem auto;padding:1rem;background:#f5f2ee;}
  button{background:#1A4A2E;color:white;border:none;padding:0.8rem 1.6rem;font-size:1rem;border-radius:8px;cursor:pointer;margin-top:1rem;}
  button:hover{background:#2A6A3E;}
  .log{margin-top:1rem;font-size:0.85rem;line-height:1.8;color:#333;}
  .ok{color:green;} .err{color:red;}
</style>
</head>
<body>
<h2>📸 Colombia foto's downloaden</h2>
<p>Klik de knop, selecteer de <strong>img/</strong> map in de Colombia-projectmap. De 3 foto's worden automatisch opgeslagen.</p>
<button id="btn">📂 Selecteer img/-map & download</button>
<div class="log" id="log"></div>
<script>
const IMAGES = [
  { url: 'https://upload.wikimedia.org/wikipedia/commons/1/12/Sunset-cartagena-tower-dewired.jpg', name: 'cartagena_murallas.jpg' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/1/16/Plazoleta_de_los_z%C3%B3calos_%282%29.JPG', name: 'guatape_zocalos.jpg' },
  { url: 'https://upload.wikimedia.org/wikipedia/commons/f/f8/Salento_Quindio_Colombia.jpg', name: 'salento_mirador.jpg' },
];

const log = document.getElementById('log');
function msg(text, cls='') { log.innerHTML += `<div class="${cls}">${text}</div>`; }

document.getElementById('btn').addEventListener('click', async () => {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    for (const img of IMAGES) {
      msg(`⏳ Downloaden: ${img.name}...`);
      try {
        const resp = await fetch(img.url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const blob = await resp.blob();
        const file = await dir.getFileHandle(img.name, { create: true });
        const writer = await file.createWritable();
        await writer.write(blob);
        await writer.close();
        msg(`✅ ${img.name} opgeslagen`, 'ok');
      } catch(e) {
        msg(`❌ ${img.name}: ${e.message}`, 'err');
      }
    }
    msg('Klaar! Je kunt dit venster sluiten.', 'ok');
  } catch(e) {
    msg('Geannuleerd of fout: ' + e.message, 'err');
  }
});
</script>
</body>
</html>
